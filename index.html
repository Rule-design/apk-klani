<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<meta name="google-site-verification" content="-74BQX5sGJlVFimG-7SLJtrTErREPikMr2hAirhaNtA" />
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK Klanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{color-scheme:dark;--bg:#030304;--s1:#0c0d11;--s2:#15171e;--line:#1e212a;--text:#f2f3f7;--mut:#868c9f;--acc:#ff4d6d;--ink:#fff;--glow:rgba(255,77,109,.25);--hl:#ffb020}
:root[data-theme=light]{color-scheme:light;--bg:#f6f7fb;--s1:#fff;--s2:#eceff5;--line:#e2e5ee;--text:#0f172a;--mut:#5a6478;--acc:#e11d48;--ink:#fff;--glow:rgba(225,29,72,.14);--hl:#b45309}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Manrope","Segoe UI","Noto Sans",system-ui,-apple-system,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .5s var(--ease),color .5s var(--ease)}
button,input{font-family:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background-color .5s var(--ease),border-color .5s}
.bar .wrap{display:flex;align-items:center;gap:10px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.03em;white-space:nowrap;margin-inline-end:6px}
.sf{flex:1;min-width:0;max-width:520px;position:relative;margin-inline:auto 0}
.sf input{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 46px 10px 14px;color:var(--text);font:inherit;transition:border-color .3s,box-shadow .3s var(--ease),background-color .5s}
[dir=rtl] .sf input{padding:10px 14px 10px 46px}
.sf input::placeholder{color:var(--mut)}
.sf input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.sf button{position:absolute;inset-block:4px;inset-inline-end:4px;width:36px;border-radius:9px;display:grid;place-items:center;background:var(--acc);color:var(--ink);transition:transform .25s var(--ease),filter .2s}
.sf button:hover{filter:brightness(1.12);transform:scale(1.06)}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);position:relative;flex:none;transition:transform .25s var(--ease),border-color .3s,background-color .5s}
.ib:hover{border-color:var(--acc);transform:translateY(-2px)}
.ib:active,.sf button:active,.chip:active,.btn:active{transform:scale(.94)}
.ib svg{transition:transform .6s var(--ease),opacity .4s}
#th svg{position:absolute}
[data-theme=dark] #th .moon{opacity:0;transform:rotate(-120deg) scale(.3)}
[data-theme=light] #th .sun{opacity:0;transform:rotate(120deg) scale(.3)}
.lw{position:relative;flex:none}
.lw .ib{width:auto;padding:0 12px;gap:6px;display:flex;align-items:center;font-size:13px;font-weight:700}
.lm{position:absolute;inset-inline-end:0;top:52px;width:200px;max-height:60vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:opacity .3s var(--ease),transform .35s var(--ease),visibility .35s,background-color .5s}
[dir=rtl] .lm{transform-origin:top left}
.lm.on{opacity:1;visibility:visible;transform:none}
.lm button{display:block;width:100%;text-align:start;padding:9px 12px;border-radius:9px;transition:background-color .2s,padding .25s var(--ease)}
.lm button:hover{background:var(--s2);padding-inline-start:16px}
.lm button[aria-current=true]{background:var(--acc);color:var(--ink)}
.hero{position:relative;height:clamp(150px,22vw,210px);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(60% 90% at 50% 100%,var(--glow),transparent 70%),var(--bg);transition:background-color .5s}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(60% 80% at 50% 60%,#000,transparent);opacity:.7}
.hero svg{position:relative;width:min(270px,52%);height:auto;filter:drop-shadow(0 16px 28px var(--glow));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(-1.5deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:10px;font-weight:500;border:1px solid var(--line);background:var(--s1);color:var(--mut);font-size:14px;transition:background-color .35s var(--ease),color .35s,border-color .35s,transform .3s var(--ease)}
.chip:hover{border-color:var(--acc);color:var(--text);transform:translateY(-2px)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:700;transform:scale(1.05)}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
h2 em{font-style:normal;font-size:13px;font-weight:700;color:var(--mut);background:var(--s2);border-radius:8px;padding:2px 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:14px}
.card{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--line);text-align:start;animation:rise .6s var(--ease) both;animation-delay:calc(var(--n)*50ms);transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
.card .im{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s var(--ease)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85))}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.28);border-color:var(--acc)}
.card:hover .im{transform:scale(1.08)}
.card .nm{position:absolute;z-index:1;inset:auto 10px 10px;color:#fff;font-weight:700;font-size:14px;line-height:1.25}
.card .nm small{display:block;font-weight:400;opacity:.75;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.empty{display:none;place-items:center;gap:10px;text-align:center;color:var(--mut);padding:44px 0}
.empty.on{display:grid;animation:rise .6s var(--ease)}
.empty svg{width:120px;opacity:.55}
dialog{padding:0;border:1px solid var(--line);border-radius:20px;background:var(--s1);color:var(--text);width:min(440px,92vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px);animation:fade .35s both}
dialog[open]{animation:pop .45s var(--ease) both}
dialog.out{animation:popout .25s ease both}
dialog.out::backdrop{animation:fade .25s reverse both}
@keyframes pop{from{opacity:0;transform:translateY(28px) scale(.94)}}
@keyframes popout{to{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes fade{from{opacity:0}}
.pic{aspect-ratio:1/1;background-size:cover;background-position:center}
.info{padding:20px}
.info h3{margin:0 0 4px;font-size:22px}
.tag{display:inline-block;background:var(--s2);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--mut)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0}
dt{color:var(--mut)}dd{margin:0}
.acts{display:flex;gap:10px}
.btn{flex:1;text-align:center;padding:12px 18px;border-radius:12px;font-weight:700;background:var(--acc);color:var(--ink);transition:transform .25s var(--ease),filter .2s,background-color .3s}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn.g{background:transparent;color:var(--text);border:1px solid var(--line)}
.hl{margin:3.2em 0 0;font-size:14.5px;color:var(--text)}
.hl u{color:var(--hl);font-weight:800;text-underline-offset:3px;text-decoration-thickness:2px}
.ds{margin:14px 0 0;color:var(--mut);font-size:14.5px;line-height:1.65;white-space:pre-line}
.logo svg{width:30px;height:auto}
.tl{margin:1.1em 0 0;font-size:14px;font-weight:700}
[data-theme=light] .bar{background:rgba(255,255,255,.86);box-shadow:0 4px 16px rgba(15,23,42,.04)}
[data-theme=light] .hero{background:radial-gradient(60% 100% at 50% 100%,var(--glow),transparent 70%),linear-gradient(#fff,#f1f3f9)}
[data-theme=light] .hero::before{opacity:.45}
[data-theme=light] .card{border-color:transparent;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 18px rgba(15,23,42,.06)}
[data-theme=light] .card:hover{border-color:var(--acc);box-shadow:0 16px 32px rgba(15,23,42,.16)}
[data-theme=light] .ib,[data-theme=light] .sf input,[data-theme=light] .chip{box-shadow:0 1px 2px rgba(15,23,42,.05)}
[data-theme=light] .chip[aria-pressed=true]{box-shadow:0 6px 14px var(--glow)}
[data-theme=light] .lm{box-shadow:0 20px 44px rgba(15,23,42,.14)}
[data-theme=light] dialog{box-shadow:0 30px 70px rgba(15,23,42,.25)}
main{padding-bottom:50px}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}.card .nm{font-size:12px;inset:auto 8px 8px}.card .nm small{display:none}.logo{font-size:16px}.bar .wrap{gap:8px}.ib{width:38px;height:38px}.lw .ib{padding:0 9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

const $=id=>document.getElementById(id),R=document.documentElement;
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let lang="tr",sel=new Set();
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const t=i=>L[lang][i];
const art=g=>{if(g.img)return g.img;let h=0;for(const c of g.ad)h=(h*31+c.charCodeAt(0))%360;
 return"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h} 70% 45%)"/><stop offset="1" stop-color="hsl(${(h+60)%360} 60% 14%)"/></linearGradient></defs><rect width="300" height="400" fill="url(#a)"/></svg>`)};

function chips(){const c=$("chips");c.innerHTML="";
 const add=(label,on,fn)=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;c.appendChild(b)};
 add(t(1),sel.size===0,()=>{sel.clear();chips();grid()});
 G.forEach((k,i)=>add(t(8+i),sel.has(k),()=>{sel.has(k)?sel.delete(k):sel.add(k);chips();grid()}));}
function grid(){const q=$("q").value.trim().toLocaleLowerCase(lang),g=$("grid");g.innerHTML="";
 const list=games.filter(x=>(!sel.size||sel.has(x.tur))&&x.ad.toLocaleLowerCase(lang).includes(q));
 list.forEach((x,n)=>{const b=document.createElement("button");b.className="card";b.type="button";b.style.setProperty("--n",Math.min(n,12));
  b.innerHTML=`<div class="im" style="background-image:url('${art(x)}')"></div><div class="nm">${x.ad}<small>${t(8+G.indexOf(x.tur))}</small></div>`;
  b.onclick=()=>show(x);g.appendChild(b)});
 $("empty").classList.toggle("on",!list.length);$("cnt").textContent=list.length;document.querySelector("h2").style.display=list.length?"":"none";}
const TRS={tr:"Türkçe Dil Desteği Mevcuttur.",en:"Turkish language support is available.",az:"Türk dili dəstəyi mövcuddur."};
const d=$("dlg");
function show(x){d.classList.remove("out");
 d.innerHTML=`<div class="pic" style="background-image:url('${art(x)}')"></div><div class="info"><h3>${x.ad}</h3><span class="tag">${t(8+G.indexOf(x.tur))}</span>
 <p class="ds">${(x.desc&&(x.desc[lang]||x.desc.en))||""}</p>${x.hile?(h=>`<p class="hl"><u>${h[0]}</u>: ${h[1]}</p>`)(x.hile[lang]||x.hile.en):""}${x.trdil?`<p class="tl">${TRS[lang]||TRS.en}</p>`:""}
 <dl>${x.surum?`<dt>${t(6)}</dt><dd>${x.surum}</dd>`:""}${x.boyut?`<dt>${t(7)}</dt><dd>${x.boyut}</dd>`:""}${x.android?`<dt>Android</dt><dd>${x.android}</dd>`:""}</dl>
 <div class="acts">${x.downloads?x.downloads.map(d=>`<a class="btn" href="${d.url}" target="_blank" rel="noopener">${d.label}</a>`).join(""): `<a class="btn" href="${x.link||"#"}" target="_blank" rel="noopener">${t(4)}</a>`}<button class="btn g" type="button" id="x">${t(5)}</button></div></div>`;
 d.showModal();$("x").onclick=close_;}
function close_(){if(still){d.close();return}d.classList.add("out");d.addEventListener("animationend",()=>{d.classList.remove("out");d.close()},{once:true})}
d.addEventListener("click",e=>{if(e.target===d)close_()});
d.addEventListener("cancel",e=>{e.preventDefault();close_()});

function setLang(l,anim){lang=l;sv("lang",l);R.lang=l;R.dir=["ar","fa","he","ur"].includes(l)?"rtl":"ltr";
 $("lc").textContent=l==="zh-TW"?"TW":l.toUpperCase();$("q").placeholder=t(0);
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(+e.dataset.i));
 chips();grid();
 [...$("lm").children].forEach(b=>b.setAttribute("aria-current",b.dataset.l===l));
 if(anim&&!still)document.querySelector("main").animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],{duration:450,easing:"cubic-bezier(.22,1,.36,1)"});}
Object.keys(LN).forEach(l=>{const b=document.createElement("button");b.type="button";b.dataset.l=l;b.textContent=LN[l];b.onclick=()=>{setLang(l,true);menu(false)};$("lm").appendChild(b)});
function menu(on){$("lm").classList.toggle("on",on);$("lb").setAttribute("aria-expanded",on)}
$("lb").onclick=e=>{e.stopPropagation();menu(!$("lm").classList.contains("on"))};
document.addEventListener("click",e=>{if(!e.target.closest(".lw"))menu(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});

function setTheme(n){R.dataset.theme=n;sv("theme",n)}
$("th").onclick=e=>{const n=R.dataset.theme==="dark"?"light":"dark";
 if(!document.startViewTransition||still){setTheme(n);return}
 const r=$("th").getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 const tr=document.startViewTransition(()=>setTheme(n));
 tr.ready.then(()=>R.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${rad}px at ${x}px ${y}px)`]},{duration:700,easing:"cubic-bezier(.22,1,.36,1)",pseudoElement:"::view-transition-new(root)"}));};
$("q").addEventListener("input",grid);
$("sf").addEventListener("submit",grid);

const st=ld("theme");if(st==="light"||st==="dark")R.dataset.theme=st;
const sl=ld("lang");setLang(L[sl]?sl:"tr",false);
</script>
